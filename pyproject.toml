[project]
name = "iconsmith"
version = "0.1.0"
description = "Set-conditioned icon completion: a small transformer that draws a new icon in the style of an existing icon set."
readme = "README.md"
authors = [
    { name = "Ashwanth Fernando", email = "ashwanthfernando@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "numpy",
    "svgelements",
    "sentence-transformers",
    "pillow",
    "tqdm",
    "requests",
    "resvg-py>=0.5.0",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["iconsmith"]
